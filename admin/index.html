<!doctype html>
<html lang="en">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Food Inspector Admin</title>
<style>body{margin:0;background:#17212b;color:#f4f1de;font:16px system-ui,sans-serif}main{max-width:760px;margin:0 auto;padding:48px 24px}h1{font-size:38px;margin:8px 0 32px}.eyebrow{color:#e9c46a;letter-spacing:2px;font-size:12px;font-weight:700}label{display:block;color:#bdc7cf;margin:18px 0 8px}input,button{box-sizing:border-box;width:100%;min-height:48px;border-radius:8px;border:1px solid #526574;padding:12px;font-size:16px}input{background:#263644;color:#fff}button{margin-top:22px;background:#e9c46a;border:0;color:#17212b;font-weight:700;cursor:pointer}.panel{margin-top:28px;padding:20px;background:#263644;border-left:4px solid #e9c46a;white-space:pre-wrap;overflow:auto}.fresh{color:#70c1b3}.expired{color:#e76f51}</style></head>
<body><main><div class="eyebrow">FOOD INSPECTOR</div><h1>Scan review desk</h1><label>Render API URL</label><input id="api" value="https://food-inspector-scanner.onrender.com"><label>Product image</label><input id="image" type="file" accept="image/*"><button id="scan">Run inspection</button><div id="result" class="panel">No inspection yet.</div></main>
<script>const result=document.querySelector('#result');document.querySelector('#scan').onclick=async()=>{const file=document.querySelector('#image').files[0];if(!file){result.textContent='Choose an image first.';return}result.textContent='Scanning...';const body=new FormData();body.append('image',file);try{const r=await fetch(document.querySelector('#api').value.replace(/\/$/,'')+'/scan',{method:'POST',body});const data=await r.json();result.textContent=JSON.stringify(data,null,2);result.className='panel '+String(data.status||'').toLowerCase()}catch(e){result.textContent='Request failed: '+e.message}};</script></body></html>
