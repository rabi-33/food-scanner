services:
  - type: web
    name: food-inspector-scanner
    runtime: python
    plan: free
    buildCommand: pip install -r api/requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
  - type: web
    name: food-inspector-admin
    runtime: static
    plan: free
    buildCommand: ""
    staticPublishPath: ./admin